name: Refresh cinematic hero references
on:
  push:
    branches: [feat/cinematic-refinement]
    paths: [.github/workflows/refresh-cinematic-baselines.yml]
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cinematic-refinement
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Regenerate hero screenshots on pinned browser
        run: |
          pnpm exec playwright test --grep 'visual region: home-hero' --project=desktop-1366 --project=mobile-390 --update-snapshots
      - name: Commit corrected visual references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/desktop-1366/home-hero.png tests/browser/baselines/mobile-390/home-hero.png
          if ! git diff --cached --quiet; then
            git commit -m "test: track intentional SHUSH cinematic hero visual composition"
            git fetch origin feat/cinematic-refinement
            git rebase origin/feat/cinematic-refinement
            git push origin HEAD:refs/heads/feat/cinematic-refinement
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cinematic-hero-captures
          path: |
            test-results/
            tests/browser/baselines/*/home-hero.png
          retention-days: 7
