name: Refresh SHUSH v3 player-profile references
on:
  push:
    branches: [feat/immersive-intro-motion-v3]
    paths: [.github/workflows/refresh-immersive-snapshots.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/immersive-intro-motion-v3
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Update player-profile snapshots only
        run: pnpm exec playwright test --grep 'visual region: player-profile' --project=desktop-1366 --project=mobile-390 --update-snapshots
      - name: Commit deterministic references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/desktop-1366/player-profile.png tests/browser/baselines/mobile-390/player-profile.png
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh approved SHUSH motion-control footer screenshots"
            git push origin HEAD:refs/heads/feat/immersive-intro-motion-v3
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspected-profile-comparisons
          path: |
            test-results/
            tests/browser/baselines/*/player-profile.png
          retention-days: 7
