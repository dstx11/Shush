name: Refresh SHUSH Player Select reference captures
on:
  push:
    branches: [feat/roster-select-season-polish]
    paths:
      - .github/workflows/refresh-roster-references.yml
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/roster-select-season-polish
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Record reviewed Player Select desktop/mobile renders
        run: |
          pnpm exec playwright test --grep 'visual region: player-profile' --project=desktop-1366 --project=mobile-390 --update-snapshots
      - name: Commit updated pixel references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/desktop-1366/player-profile.png tests/browser/baselines/mobile-390/player-profile.png
          if ! git diff --cached --quiet; then
            git commit -m "test: capture redesigned Player Select in desktop and mobile"
            git fetch origin feat/roster-select-season-polish
            git rebase origin/feat/roster-select-season-polish
            git push origin HEAD:refs/heads/feat/roster-select-season-polish
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shush-player-select-review
          path: |
            tests/browser/baselines/*/player-profile.png
            test-results/
          retention-days: 7
