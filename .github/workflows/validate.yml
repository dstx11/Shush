name: Validate site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Validate dist
        run: pnpm run validate:dist

      - name: Bundle budget
        run: pnpm run check:bundle

      - name: Static deploy smoke
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/esports/valorant/premier/index.html
          test -f dist/esports/valorant/roster/index.html
          test -f dist/content/index.html
          test -f dist/products/jersey/index.html
          test -f dist/company/index.html
          grep -q 'lang="pt-PT"' dist/index.html
          grep -q 'Content-Security-Policy' dist/_headers
          grep -Fq '<title>Premier — SHUSH</title>' dist/esports/valorant/premier/index.html
          grep -Fq 'https://shush.pt/esports/valorant/premier' dist/esports/valorant/premier/index.html
          grep -Fq '<title>Drop 01 — SHUSH</title>' dist/products/jersey/index.html
          ! grep -Fq '/* /index.html 200' dist/_redirects
