name: Visual audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.ref == 'audit-pro-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm dlx playwright@1.56.1 install --with-deps chromium

      - name: Start preview
        run: |
          pnpm run preview --host 0.0.0.0 > /tmp/shush-preview.log 2>&1 &
          echo $! > /tmp/shush-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shush-preview.log
          exit 1

      - name: Capture desktop
        run: |
          mkdir -p visual-audit
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/ visual-audit/home-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/esports/valorant/premier visual-audit/premier-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/esports/valorant/roster visual-audit/roster-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/content visual-audit/creators-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/products/jersey visual-audit/drop-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,1100" http://127.0.0.1:4173/company visual-audit/about-desktop.png

      - name: Capture mobile
        run: |
          pnpm dlx playwright@1.56.1 screenshot --full-page --device="iPhone 13" http://127.0.0.1:4173/ visual-audit/home-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --device="iPhone 13" http://127.0.0.1:4173/products/jersey visual-audit/drop-mobile.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shush-visual-audit
          path: visual-audit/*.png
          retention-days: 1
