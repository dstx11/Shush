name: Refresh reviewed cozy references
on:
  push:
    branches: [cozy-design-system]
    paths: [.github/workflows/refresh-cozy-reference.yml]
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cozy-design-system
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Generate intentional public-page and seasonal references
        run: pnpm exec playwright test tests/browser/visual.spec.ts tests/browser/cinematic.spec.ts --grep 'visual region|cinematic tree:' --project desktop-1366 --project mobile-390 --update-snapshots
      - name: Save references to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/baselines
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh references for cozy surfaces and controls'
            git push origin HEAD:cozy-design-system
          fi
