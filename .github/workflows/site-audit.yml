name: Responsive and performance audit
on:
  push:
    branches: ['audit/**', 'shush-audit-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the same measurements for both builds
        shell: bash
        run: |
          cp tests/audit/responsive.mjs "$RUNNER_TEMP/responsive.mjs"
          if [[ "${{ matrix.version }}" == baseline ]]; then
            git checkout --detach b581485a01e575d6d30f0ae6550ff18512dce11d
          fi
          mkdir -p tests/audit
          cp "$RUNNER_TEMP/responsive.mjs" tests/audit/responsive.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Serve production bundle
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1
      - name: Viewports, console, first-party network, axe and screenshots
        id: responsive
        run: node tests/audit/responsive.mjs
      - name: Keyboard, motion, archive and roster journeys
        if: matrix.version == 'candidate' && !cancelled() && steps.responsive.outcome != 'skipped'
        env:
          SHUSH_AUDIT_SERVER: '1'
        run: pnpm exec playwright test intro-v3.spec.ts curated-motion.spec.ts audit-regressions.spec.ts audit-improvements.spec.ts --project=desktop-1366 --project=mobile-390 --output=test-results/journeys --workers=3 --reporter=list
      - name: Lighthouse mobile on all five pages
        if: always() && steps.responsive.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome)"
          for path in / /esports/valorant/premier /esports/valorant/roster /content /company; do
            slug="${path##*/}"
            out="test-results/site-audit/lighthouse-${slug:-home}.json"
            pnpm dlx lighthouse@12.8.2 "http://127.0.0.1:4173$path" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output-path="$out"
            jq -c '{url: .finalDisplayedUrl, scores: (.categories|map_values(.score)), LCP: .audits["largest-contentful-paint"].numericValue, CLS: .audits["cumulative-layout-shift"].numericValue}' "$out"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-audit-${{ matrix.version }}
          path: test-results/site-audit/
          retention-days: 14
