name: Refresh layout references
# Recheck guarded restoration before recording references.
on:
  push:
    branches: [layout-polish]
    paths: ['.github/workflows/refresh-layout-reference.yml']
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: layout-polish
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run build
      - run: pnpm exec playwright test tests/browser/audit-regressions.spec.ts tests/browser/site.spec.ts tests/browser/cozy.spec.ts --grep 'Back restores|desktop preview|layout:' --repeat-each=3
      - run: pnpm exec playwright test tests/browser/visual.spec.ts --project desktop-1366 --project mobile-390 --update-snapshots
      - name: Commit reviewed-region candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/baselines
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh layout alignment references'
            git push origin HEAD:layout-polish
          fi
